<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><title>Hockey Tactics</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f6f7;color:#17212b}header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:white;border-bottom:1px solid #ddd}h1{font-size:18px;margin:0}button,input,select,textarea{font:inherit}button{border:1px solid #cdd4d9;background:white;border-radius:9px;padding:9px 11px;cursor:pointer}button.active,.primary{background:#123e78;color:white;border-color:#123e78}.toolbar{display:flex;gap:7px;flex-wrap:wrap;padding:10px;justify-content:center}.layout{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:12px;max-width:1100px;margin:auto;padding:10px}.pitchwrap{background:#22783e;position:relative;touch-action:none;aspect-ratio:55/91;max-height:75vh;margin:auto;width:auto;overflow:hidden;border-radius:4px}.pitch{width:100%;height:100%;display:block;touch-action:none}#pitchwrap,#pitchwrap *{touch-action:none}.player{position:absolute;transform:translate(-50%,-50%);text-align:center;touch-action:none;user-select:none;cursor:grab;z-index:3;min-width:55px}.disc{width:31px;height:31px;display:grid;place-items:center;margin:auto;border-radius:50%;background:#133f88;border:2px solid white;color:white;font-weight:700;box-shadow:0 1px 4px #0005}.opponent .disc{background:#bd3030}.player small{display:block;background:#ffffffde;color:#111;border-radius:4px;font-size:10px;white-space:nowrap;padding:1px 3px}.ball{position:absolute;transform:translate(-50%,-50%);width:17px;height:17px;background:white;border:2px solid #333;border-radius:50%;z-index:4;touch-action:none}.side{background:white;border-radius:12px;padding:12px;min-width:0}.side h3{margin:10px 0}.benchitem{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:5px 0;gap:5px}.benchitem button{padding:4px 7px}input,textarea,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:7px;margin:4px 0 8px}textarea{min-height:70px}.hidden{display:none!important}.canvasOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}.fullscreen .hidefull{display:none}.fullscreen .layout{display:block}.fullscreen .pitchwrap{max-height:95vh}#status{font-size:12px;color:#64748b}@media(max-width:650px){.layout{display:flex;flex-direction:column;padding:10px 4px}.pitchwrap{width:min(100%,55vh);max-width:calc(100vw - 92px);max-height:none}.side{width:100%}}@media(orientation:landscape) and (max-height:600px){.layout{grid-template-columns:minmax(0,1fr) 180px}.pitchwrap{max-height:73vh}}  .stepnav{display:flex;align-items:center;justify-content:center;gap:7px;margin:0 auto 10px;max-width:520px}.stepnav button{padding:10px 8px;white-space:nowrap}.stepnav #stepLabel{font-size:13px;white-space:nowrap;font-weight:650;flex:1;text-align:center}@media(max-width:420px){.stepnav{gap:4px}.stepnav button{font-size:13px;padding:9px 6px}.stepnav #stepLabel{font-size:12px}} .side details{border:1px solid #d9e0e5;border-radius:9px;margin-bottom:10px;padding:9px}.side summary{cursor:pointer;font-weight:650;list-style-position:inside}.side summary span{font-size:12px;font-weight:400;color:#64748b}.side details[open] summary{margin-bottom:8px} </style></head><body>
<header class="hidefull"><h1>🏑 Hockey Tactics</h1><span id="status">Saved locally</span></header>
<div class="toolbar hidefull"><button id="setup">Team setup</button></div>
<div class="toolbar hidefull"><button data-mode="move" class="active">Move</button><button data-mode="run">🟡 Movement</button><button data-mode="pass">🔵 Pass</button><button id="undo">Undo line</button><button id="clear">Clear lines</button><button id="clearPlayers">Clear players</button><button id="opToggle">Opposition</button><button id="export">Export PNG</button></div>
<div class="layout"><main><div class="stepnav"><button id="prev">◀ Back</button><span id="stepLabel">Step 1 / 1</span><button id="next" class="primary">Next ▶</button><button id="addstep">+ Add</button></div><div class="pitchwrap" id="pitchwrap"><svg class="pitch" viewBox="0 0 550 910" preserveAspectRatio="none"><rect width="550" height="910" fill="#267c41"/><g fill="#ffffff" opacity=".05"><rect width="550" height="130"/><rect y="260" width="550" height="130"/><rect y="520" width="550" height="130"/><rect y="780" width="550" height="130"/></g><g stroke="white" stroke-width="4" fill="none"><rect x="12" y="12" width="526" height="886"/><path d="M12 455H538 M12 237H538 M12 673H538"/><path d="M175 12V33H375V12 M175 898V877H375V898"/><path d="M75 12V60 A200 200 0 0 0 475 60V12 M75 898V850 A200 200 0 0 1 475 850V898"/></g><g fill="white"><circle cx="275" cy="100" r="5"/><circle cx="275" cy="810" r="5"/></g></svg><svg class="canvasOverlay" id="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="tokens"></div></div></main>
<aside class="side hidefull"><details id="teamBench"><summary>My team <span id="teamCount"></span></summary><div id="ownBench"></div></details><details id="opBench"><summary>Opposition <span id="opCount"></span></summary><div id="oppBench"></div></details><h3>Coaching notes</h3><textarea id="notes" placeholder="Instructions for this step"></textarea><p style="font-size:12px;color:#64748b">Tap Next to animate to the next step. Each new session starts with a blank pitch.</p></aside></div>

<dialog id="dialog"><form method="dialog"><h2>Team setup</h2><p>Enter up to 16 players, one per line: shirt number, comma, name.</p><textarea id="roster" style="width:min(80vw,400px);height:230px"></textarea><div><button value="cancel">Cancel</button><button id="saveRoster" class="primary" value="ok">Save team</button></div></form></dialog>
<script>
const KEY='hockey-tactics-v1';const defaults=()=>({roster:Array.from({length:16},(_,i)=>({id:'p'+i,num:i+1,name:'Player '+(i+1)})),formations:[{name:'Session',steps:[{players:{},opponents:{},ball:{x:50,y:50},lines:[],notes:''}]}],fi:0,si:0,op:true,showBall:false,view:0});let state=defaults();try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved?.roster)&&saved.roster.length)state.roster=saved.roster}catch{}let mode='move',drawing=null,drag=null,pressTimer=null,pressStart=null,longPressed=false;const $=id=>document.getElementById(id),wrap=$('pitchwrap');function step(){return state.formations[state.fi].steps[state.si]}function save(){localStorage.setItem(KEY,JSON.stringify({roster:state.roster}));$('status').textContent='Session in progress'}function point(e){const r=wrap.getBoundingClientRect();return{x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))}}function basePositions(){let p={};state.roster.slice(0,11).forEach((v,i)=>p[v.id]={x:15+(i%4)*23,y:80-Math.floor(i/4)*22});return p}function render(){let s=step();if(!state.initialized){s.players={};s.opponents={};state.initialized=true;save()}$('stepLabel').textContent='Step '+(state.si+1)+' / '+state.formations[state.fi].steps.length;$('notes').value=s.notes||'';$('opToggle').classList.toggle('active',state.op);$('tokens').innerHTML='';state.roster.forEach(p=>{if(!s.players[p.id])return;addToken(p.id,p.num,p.name,s.players[p.id],false)});if(state.op)for(let i=1;i<=11;i++){let pos=s.opponents[i];if(pos)addToken('o'+i,i,'',pos,true)}$('ownBench').innerHTML='';$('oppBench').innerHTML='';state.roster.filter(p=>!s.players[p.id]).forEach(p=>{let d=document.createElement('div');d.className='benchitem';let t=document.createElement('span');t.textContent='#'+p.num+' '+p.name;let btn=document.createElement('button');btn.textContent='On pitch';btn.onclick=()=>{s.players[p.id]={x:50,y:70};save();render()};d.append(t,btn);$('ownBench').append(d)});for(let i=1;i<=11;i++){if(s.opponents[i])continue;let d=document.createElement('div');d.className='benchitem';let t=document.createElement('span');t.textContent='Red #'+i;let b=document.createElement('button');b.textContent='On pitch';b.onclick=()=>{s.opponents[i]={x:50,y:25};state.op=true;save();render()};d.append(t,b);$('oppBench').append(d)}$('teamCount').textContent='('+state.roster.filter(p=>!s.players[p.id]).length+' on bench)';$('opCount').textContent='('+Array.from({length:11},(_,i)=>i+1).filter(i=>!s.opponents[i]).length+' on bench)';drawLines()}function addToken(id,num,name,pos,opp){let d=document.createElement('div');d.className='player'+(opp?' opponent':'');d.dataset.id=id;d.style.left=pos.x+'%';d.style.top=pos.y+'%';d.innerHTML='<div class="disc">'+num+'</div>'+(name?'<small>'+escapeHtml(name)+'</small>':'');$('tokens').append(d)}function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function smoothPath(points){if(points.length<2)return '';const start=points[0],end=points[points.length-1],dx=end.x-start.x,dy=end.y-start.y,len=Math.hypot(dx,dy);if(len<1)return '';let mid=points[Math.floor(points.length/2)],cross=((mid.x-start.x)*dy-(mid.y-start.y)*dx)/(len||1);let bend=Math.max(-Math.min(len*.12,5),Math.min(Math.min(len*.12,5),-cross*.35));let mx=(start.x+end.x)/2-dy/len*bend,my=(start.y+end.y)/2+dx/len*bend;return 'M '+start.x+' '+start.y+' Q '+mx+' '+my+' '+end.x+' '+end.y}function drawLines(){let svg=$('lines');svg.innerHTML='<defs><marker id="arun" markerUnits="userSpaceOnUse" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#ffe033"/></marker><marker id="apass" markerUnits="userSpaceOnUse" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#4ac5ff"/></marker></defs>';[...step().lines,...(drawing?[drawing]:[])].forEach(l=>{if(l.pts.length<2)return;let el=document.createElementNS('http://www.w3.org/2000/svg','path');el.setAttribute('d',smoothPath(l.pts));el.setAttribute('fill','none');el.setAttribute('stroke',l.type==='run'?'#ffe033':'#4ac5ff');el.setAttribute('stroke-width','0.8');el.setAttribute('stroke-linecap','round');el.setAttribute('stroke-linejoin','round');el.setAttribute('marker-end','url(#a'+l.type+')');svg.append(el)})}wrap.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});wrap.addEventListener('touchstart',e=>{if(mode!=='move'||e.target.closest('[data-id]'))e.preventDefault()},{passive:false});wrap.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!e.isPrimary)return;let id=e.target.closest('[data-id]')?.dataset.id;if(mode==='move'&&!id)return;longPressed=false;if(mode==='move'&&id){drag=id;pressStart=point(e);clearTimeout(pressTimer);if(id!=='ball')pressTimer=setTimeout(()=>{longPressed=true;drag=null;let s=step();if(id.startsWith('o'))delete s.opponents[+id.slice(1)];else delete s.players[id];save();render()},600);wrap.setPointerCapture(e.pointerId)}else if(mode!=='move'){drawing={type:mode,pts:[point(e)]};wrap.setPointerCapture(e.pointerId)}});wrap.addEventListener('pointermove',e=>{if(longPressed)return;if(drag){let p=point(e);if(pressStart&&Math.hypot(p.x-pressStart.x,p.y-pressStart.y)>2){clearTimeout(pressTimer);pressTimer=null}let s=step();if(drag==='ball')s.ball=p;else if(drag.startsWith('o'))s.opponents[Number(drag.slice(1))]=p;else s.players[drag]=p;let el=[...$('tokens').children].find(x=>x.dataset.id===drag);if(el){el.style.left=p.x+'%';el.style.top=p.y+'%'}}else if(drawing){drawing.pts.push(point(e));drawLines()}});function end(){clearTimeout(pressTimer);pressTimer=null;pressStart=null;if(drawing&&drawing.pts.length>1)step().lines.push(drawing);if(drag||drawing)save();drag=null;drawing=null;drawLines()}wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});$('setup').onclick=()=>{$('roster').value=state.roster.map(p=>p.num+', '+p.name).join('\n');$('dialog').showModal()};$('saveRoster').onclick=e=>{let rows=$('roster').value.split('\n').map(x=>x.trim()).filter(Boolean);if(rows.length<1||rows.length>16){e.preventDefault();alert('Enter between 1 and 16 players');return}state.roster=rows.map((r,i)=>{let a=r.split(',');return{id:'p'+i,num:(a.length>1?a.shift():i+1).toString().trim(),name:a.join(',').trim()||r}});state.formations.forEach(f=>f.steps.forEach(s=>{s.players={};s.opponents={};}));state.initialized=true;save();render()};$('addstep').onclick=()=>{let s=structuredClone(step());state.formations[state.fi].steps.splice(state.si+1,0,s);state.si++;save();render()};function goto(i){let a=state.formations[state.fi].steps;if(i<0||i>=a.length)return;const old=step(),next=a[i];state.si=i;render();let els=[...$('tokens').children];els.forEach(el=>{let id=el.dataset.id;let from=id==='ball'?old.ball:id.startsWith('o')?old.opponents[+id.slice(1)]:old.players[id];let to=id==='ball'?next.ball:id.startsWith('o')?next.opponents[+id.slice(1)]:next.players[id];if(from&&to){el.animate([{left:from.x+'%',top:from.y+'%'},{left:to.x+'%',top:to.y+'%'}],{duration:650,easing:'ease-in-out'})}});save()}$('prev').onclick=()=>goto(state.si-1);$('next').onclick=()=>goto(state.si+1);$('notes').oninput=e=>{step().notes=e.target.value;save()};$('undo').onclick=()=>{step().lines.pop();save();drawLines()};$('clear').onclick=()=>{step().lines=[];save();drawLines()};$('clearPlayers').onclick=()=>{if(!confirm('Move all players and opposition to the bench?'))return;step().players={};step().opponents={};save();render()};$('opToggle').onclick=()=>{state.op=!state.op;save();render()};$('export').onclick=()=>{let clone=wrap.cloneNode(true),svg=clone.querySelector('.pitch');let serialized=new XMLSerializer().serializeToString(svg);let img=new Image();let canvas=document.createElement('canvas');canvas.width=1100;canvas.height=1820;let ctx=canvas.getContext('2d');img.onload=()=>{ctx.drawImage(img,0,0,1100,1820);step().lines.forEach(l=>{ctx.beginPath();l.pts.forEach((p,i)=>i?ctx.lineTo(p.x*11,p.y*18.2):ctx.moveTo(p.x*11,p.y*18.2));ctx.strokeStyle=l.type==='run'?'#ffe033':'#4ac5ff';ctx.lineWidth=9;ctx.stroke()});[...$('tokens').children].forEach(el=>{let x=parseFloat(el.style.left)*11,y=parseFloat(el.style.top)*18.2;ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fillStyle=el.classList.contains('opponent')?'#bd3030':el.classList.contains('ball')?'white':'#133f88';ctx.fill();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 28px sans-serif';ctx.fillText(el.querySelector('.disc')?.textContent||'',x,y+9);let name=el.querySelector('small')?.textContent;if(name){ctx.font='22px sans-serif';ctx.fillText(name,x,y+57)}});ctx.fillStyle='#fff';ctx.fillRect(0,1710,1100,110);ctx.fillStyle='#111';ctx.textAlign='left';ctx.font='bold 29px sans-serif';ctx.fillText('Step '+(state.si+1),20,1747);ctx.font='23px sans-serif';ctx.fillText((step().notes||'').slice(0,95),20,1790);canvas.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hockey-tactics.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)})};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(serialized)};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
